name: ML Pipeline

# Runs automatically every time someone pushes to main or opens a pull request.
# You can also start it by hand: Actions tab -> ML Pipeline -> Run workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tuning:
        description: "Run full hyperparameter tuning (slower, ~15 min)"
        type: boolean
        default: false

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (data cleaning + features)
        run: pytest -q tests

      - name: Run the pipeline (clean -> train -> evaluate -> save model)
        run: |
          if [ "${{ github.event.inputs.full_tuning }}" = "true" ]; then
            python src/pipeline.py
          else
            python src/pipeline.py --quick
          fi

      - name: Show results in the run summary
        run: |
          echo "## Model results on the hold-out test set" >> $GITHUB_STEP_SUMMARY
          python -c "import pandas as pd; print(pd.read_csv('outputs/test_results.csv', index_col=0)[['accuracy','precision','recall','f1','AUC']].round(3).to_markdown())" >> $GITHUB_STEP_SUMMARY

      - name: Quality gate (fail if the best model is too weak)
        run: |
          python -c "
          import json; m = json.load(open('outputs/metrics.json'))
          print(m)
          assert m['f1'] >= 0.68, f\"F1 {m['f1']:.3f} is below 0.68\"
          assert m['AUC'] >= 0.85, f\"AUC {m['AUC']:.3f} is below 0.85\"
          print('Quality gate passed')
          "

      - name: Upload model, metrics and figures
        uses: actions/upload-artifact@v4
        with:
          name: model-and-results
          path: |
            models/model.joblib
            outputs/
